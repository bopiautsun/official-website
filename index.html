<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不標準製作 — Bô Piau Tsun Tsè-Tsok</title>
<meta name="description" content="Explore projects, writing, and portfolios by Yu-Fang LAI and Wei-Cheng HSU of 不標準製作 — Bô Piau Tsun Tsè-Tsok.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Orbitron:wght@500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="navigation.css">
</head>
<body>

<header class="topbar console-topbar">
  <a class="brand" href="works.html">
    <span class="brand-cn">不標準製作</span>
    <span class="brand-en">Bô Piau Tsun Tsè-Tsok</span>
  </a>
  <nav class="topnav" aria-label="Main navigation">
    <a href="index.html" aria-current="page" class="active">Console&nbsp;↗</a>
    <a href="works.html">Index</a>
    <a href="reader.html">Portfolio</a>
  </nav>
</header>

<div class="viewport" id="viewport">
  <div class="stage off" id="stage">

    <!-- 不標準製作 LED sign — romaji engraved on the shell's bottom edge -->
    <div class="sign">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>
      <div class="sign-screen"><div class="sign-cn">不標準製作</div></div>
      <div class="sign-plate">Bô piau tsun tsè-tsok</div>
    </div>

    <!-- instruction: riveted metal plate, enlarged — wipe the fogged text to clear it -->
    <div class="profile" id="profile">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>
      <div class="profile-heading" id="profileHeading">INSTRUCTION</div>
      <canvas class="profile-wipe" id="profileWipe" aria-hidden="true"></canvas>
      <div class="profile-body sr-only" id="profileBody">—</div>
      <button class="profile-more" id="profileMore">profile &amp; CV →</button>
    </div>

    <!-- status lamps: which of off/a/group/b is currently active -->
    <div class="face-lamps" id="faceLamps">
      <span class="face-lamp" id="lampA"></span>
      <span class="face-lamp" id="lampB"></span>
      <span class="face-lamp" id="lampGroup"></span>
    </div>

    <!-- two drawable LED face screens, paired with their name switch -->
    <div class="faces-group">
      <div class="person-unit" id="unitA">
        <div class="face-screen" id="faceWrapA">
          <canvas class="face-canvas" id="faceA" aria-label="Draw on Yu-Fang's screen"></canvas>
          <div class="face-tools">
            <button class="ftool" data-face="A" data-act="reset" title="Reset face">↺</button>
            <button class="ftool" data-face="A" data-act="clear" title="Clear">▢</button>
          </div>
        </div>
        <button class="namekey" id="keyA" aria-pressed="false"><span id="keyAName">Yu Fang<br>LAI</span></button>
      </div>
      <div class="person-unit" id="unitB">
        <div class="face-screen" id="faceWrapB">
          <canvas class="face-canvas" id="faceB" aria-label="Draw on Wei-Cheng's screen"></canvas>
          <div class="face-tools">
            <button class="ftool" data-face="B" data-act="reset" title="Reset face">↺</button>
            <button class="ftool" data-face="B" data-act="clear" title="Clear">▢</button>
          </div>
        </div>
        <button class="namekey" id="keyB" aria-pressed="false"><span id="keyBName">Wei-Cheng<br>HSU</span></button>
      </div>
    </div>

    <p class="console-hint" id="consoleHint" role="status">Select a name to explore their work. Select both for studio projects.</p>

    <!-- console shelf: nine work-select slots and a shared preview screen -->
    <div class="desk" id="desk">
      <div class="bank" id="bankUnified" aria-label="Selected works"></div>
      <a class="screen" id="screen" aria-label="Selected work preview">
        <div class="screen-inner" id="screenInner">
          <span class="screen-noise"></span>
          <span class="screen-msg">NO SIGNAL</span>
        </div>
      </a>
    </div>

    <!-- printed paper slip, curling out of a slot → writing -->
    <button class="print-slip" id="printSlip" aria-label="Open writing">
      <span class="print-slip-outline"></span>
      <span class="print-slip-paper"><span class="print-slip-lines"></span></span>
      <span class="slip-tip">writings ↓</span>
    </button>

    <!-- lever → flip through the PDF portfolio -->
    <div class="lever" id="lever" tabindex="0" role="button" aria-label="Pull the lever to open the portfolio">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>
      <span class="lever-bulb" id="leverBulb"></span>
      <span class="lever-track"></span>
      <span class="lever-handle" id="leverHandle"></span>
      <span class="lever-tip">pdf version <span class="lever-direction" aria-hidden="true">↓</span></span>
    </div>

    <!-- contact patch bay — hex-washer jacks; a banana plug + trailing cable
         insert into a person's jacks while their namekey is on -->
    <section class="contact-bay" aria-label="Contact links">
      <a class="contact-plug ig" data-person="a" data-row="0" href="https://www.instagram.com/__yf___/" target="_blank" rel="noopener noreferrer" aria-label="Yu-Fang's Instagram">
        <span class="plug-socket" aria-hidden="true">
          <span class="plug-socket-ring"></span>
          <span class="plug-socket-face"></span>
          <span class="plug-hole"></span>
          <span class="plug-jack"></span>
        </span>
        <svg class="plug-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="plug-label">@__yf___</span>
      </a>
      <button class="contact-plug email" data-person="a" data-row="1" type="button" data-email="yf.yvonne.lai@gmail.com" aria-label="Copy Yu-Fang's email address">
        <span class="plug-socket" aria-hidden="true">
          <span class="plug-socket-ring"></span>
          <span class="plug-socket-face"></span>
          <span class="plug-hole"></span>
          <span class="plug-jack"></span>
        </span>
        <svg class="plug-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1"/><path d="m3.5 6.5 8.5 7 8.5-7"/></svg>
        <span class="plug-label">yf.yvonne.lai@gmail.com</span>
      </button>
      <a class="contact-plug ig" data-person="b" data-row="2" href="https://www.instagram.com/wei._.scott_nob/" target="_blank" rel="noopener noreferrer" aria-label="Wei-Cheng's Instagram">
        <span class="plug-socket" aria-hidden="true">
          <span class="plug-socket-ring"></span>
          <span class="plug-socket-face"></span>
          <span class="plug-hole"></span>
          <span class="plug-jack"></span>
        </span>
        <svg class="plug-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="plug-label">@wei._.scott_nob</span>
      </a>
      <button class="contact-plug email" data-person="b" data-row="3" type="button" data-email="scott2984623@gmail.com" aria-label="Copy Wei-Cheng's email address">
        <span class="plug-socket" aria-hidden="true">
          <span class="plug-socket-ring"></span>
          <span class="plug-socket-face"></span>
          <span class="plug-hole"></span>
          <span class="plug-jack"></span>
        </span>
        <svg class="plug-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1"/><path d="m3.5 6.5 8.5 7 8.5-7"/></svg>
        <span class="plug-label">scott2984623@gmail.com</span>
      </button>
      <span class="contact-status" id="contactStatus" role="status" aria-live="polite"></span>
    </section>

    <!-- Oscilloscope: scrolling audio waveform inside a circular graticule. -->
    <div class="wave-dial" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <path class="scope-grid" d="M0 25H100 M0 50H100 M0 75H100 M25 0V100 M50 0V100 M75 0V100"/>
        <path class="wave-path" id="audioWave"/>
      </svg>
    </div>

    <div class="radar-console"><div class="radar" id="radar">
      <div class="radar-grid"></div><div class="radar-sweep"></div>
      <div class="radar-blip wander" id="blipWander"></div><div class="radar-blip player" id="blipPlayer"></div>
    </div></div>

  </div>
</div>

<!-- detail drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Profile and writing" aria-hidden="true" tabindex="-1">
  <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
  <div id="drawerContent"></div>
</aside>

<script src="image-manifest.js"></script>
<script src="shared.js"></script>
<script src="script.js"></script>
</body>
</html>
